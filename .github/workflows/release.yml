name: Release

# Push a version tag to publish a GitHub Release with the Android builds:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Test
        if: hashFiles('test/**/*_test.dart') != ''
        run: flutter test

      # Version name from the tag (v1.2.0 -> 1.2.0); build number from the
      # run counter so every release build is higher than the last.
      - name: Build APK and App Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          flutter build appbundle --release --build-name "$VERSION" --build-number "${{ github.run_number }}"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
